services:
  - type: web
    name: turath-gpt-proxy
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: HOST
        value: 0.0.0.0
      - key: TURATH_API_BASE
        value: https://api.turath.io
      - key: TURATH_TIMEOUT_MS
        value: "15000"
      - key: TURATH_RETRIES
        value: "2"
      - key: INDEX_CACHE_TTL_MS
        value: "86400000"
      - key: ENABLE_FILE_CACHE
        value: "true"
      - key: CACHE_DIR
        value: .cache
      - key: USER_AGENT
        value: turath-gpt-proxy/1.0 (+render)
