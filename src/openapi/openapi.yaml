openapi: 3.0.3
info:
  title: Turath GPT Proxy API
  version: 1.2.0
  description: Safe, paginated proxy between GPT Actions and Turath API.
servers:
  - url: https://turath-gpt-proxy.onrender.com
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required: [ok]
  /books/search:
    get:
      operationId: searchBooksByTitle
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        "200":
          description: Book candidates
          content:
            application/json:
              schema:
                type: object
                properties:
                  query:
                    type: string
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        book_id: { type: integer }
                        book_name: { type: string }
                        author_id: { type: integer, nullable: true }
                        author_name: { type: string }
                        score: { type: number }
                        matched_from: { type: string }
                      required: [book_id, book_name, author_name, score, matched_from]
                required: [query, results]
        "400":
          $ref: "#/components/responses/BadRequest"
        "502":
          $ref: "#/components/responses/UpstreamError"
        "504":
          $ref: "#/components/responses/UpstreamTimeout"
  /search/text:
    get:
      operationId: searchTextPaged
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
        - name: book_id
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: author_id
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
        - name: sort
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Text search page
          content:
            application/json:
              schema:
                type: object
                properties:
                  query: { type: string }
                  page: { type: integer }
                  count: { type: integer }
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        book_id: { type: integer, nullable: true }
                        author_id: { type: integer, nullable: true }
                        book_name: { type: string, nullable: true }
                        author_name: { type: string, nullable: true }
                        page: { type: integer, nullable: true }
                        page_id: { type: integer, nullable: true }
                        vol: { type: string, nullable: true }
                        headings:
                          type: array
                          items: { type: string }
                        snip: { type: string }
                        text: { type: string }
                required: [query, page, count, results]
        "400":
          $ref: "#/components/responses/BadRequest"
        "502":
          $ref: "#/components/responses/UpstreamError"
        "504":
          $ref: "#/components/responses/UpstreamTimeout"
  /books/{book_id}/pages/{page}:
    get:
      operationId: getBookPage
      parameters:
        - name: book_id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - name: page
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Book page
          content:
            application/json:
              schema:
                type: object
                properties:
                  book_id: { type: integer }
                  page: { type: integer }
                  meta:
                    type: object
                    additionalProperties: true
                  meta_raw: { type: string }
                  text: { type: string }
                required: [book_id, page, text]
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /books/{book_id}/index/top:
    get:
      operationId: getBookTopIndex
      parameters:
        - name: book_id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - name: max_level
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 10
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Top index headings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /books/{book_id}/index/search:
    get:
      operationId: searchBookIndex
      parameters:
        - name: book_id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
        - name: max_level
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 10
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        "200":
          description: Ranked index matches
          content:
            application/json:
              schema:
                type: object
                properties:
                  book_id: { type: integer }
                  query: { type: string }
                  results:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/Heading"
                        - type: object
                          properties:
                            score: { type: number }
                required: [book_id, query, results]
        "400":
          $ref: "#/components/responses/BadRequest"
  /books/{book_id}/index/chunk:
    get:
      operationId: getBookIndexChunk
      parameters:
        - name: book_id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: max_level
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 10
      responses:
        "200":
          description: Chunked index headings
          content:
            application/json:
              schema:
                type: object
                properties:
                  book_id: { type: integer }
                  offset: { type: integer }
                  limit: { type: integer }
                  has_more: { type: boolean }
                  next_offset: { type: integer, nullable: true }
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/Heading"
                required: [book_id, offset, limit, has_more, results]
        "400":
          $ref: "#/components/responses/BadRequest"
  /books/{book_id}/index/window:
    get:
      operationId: getBookIndexWindow
      parameters:
        - name: book_id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - name: page
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
        - name: before
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 30
            default: 5
        - name: after
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 30
            default: 5
      responses:
        "200":
          description: Heading window around page
          content:
            application/json:
              schema:
                type: object
                properties:
                  book_id: { type: integer }
                  page: { type: integer }
                  current:
                    allOf:
                      - $ref: "#/components/schemas/Heading"
                    nullable: true
                  before:
                    type: array
                    items:
                      $ref: "#/components/schemas/Heading"
                  after:
                    type: array
                    items:
                      $ref: "#/components/schemas/Heading"
                required: [book_id, page, before, after]
        "400":
          $ref: "#/components/responses/BadRequest"
  /authors/{author_id}:
    get:
      operationId: getAuthorInfo
      parameters:
        - name: author_id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Author info
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer, nullable: true }
                  name: { type: string, nullable: true }
                  note: { type: string, nullable: true }
                additionalProperties: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
          required: [code, message]
      required: [error]
    Heading:
      type: object
      properties:
        title: { type: string }
        page: { type: integer }
        level: { type: integer }
        breadcrumb:
          type: array
          items: { type: string }
      required: [title, page, level]
    IndexListResponse:
      type: object
      properties:
        book_id: { type: integer }
        max_level: { type: integer }
        results:
          type: array
          items:
            $ref: "#/components/schemas/Heading"
      required: [book_id, max_level, results]
  responses:
    BadRequest:
      description: Invalid request input
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UpstreamError:
      description: Upstream Turath error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UpstreamTimeout:
      description: Upstream timeout
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
