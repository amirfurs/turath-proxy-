openapi: 3.1.0
info:
  title: Turath GPT Proxy
  version: 1.0.0
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /books/search:
    get:
      operationId: searchBooksByTitle
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses: { "200": { description: ok } }
  /search/text:
    get:
      operationId: searchTextPaged
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string }
      responses: { "200": { description: ok } }
  /books/{book_id}/pages/{page}:
    get:
      operationId: getBookPage
      parameters:
        - in: path
          name: book_id
          required: true
          schema: { type: integer }
        - in: path
          name: page
          required: true
          schema: { type: integer }
      responses: { "200": { description: ok } }
  /books/{book_id}/index/top:
    get:
      operationId: getBookTopIndex
      responses: { "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/IndexTopResponse" } } } } }
  /books/{book_id}/index/search:
    get:
      operationId: searchBookIndex
      responses: { "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/IndexSearchResponse" } } } } }
  /books/{book_id}/index/chunk:
    get:
      operationId: getBookIndexChunk
      responses: { "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/IndexChunkResponse" } } } } }
  /books/{book_id}/index/window:
    get:
      operationId: getBookIndexWindow
      responses: { "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/IndexWindowResponse" } } } } }
  /authors/{author_id}:
    get:
      operationId: getAuthorInfo
      responses: { "200": { description: ok } }
components:
  schemas:
    HealthResponse:
      type: object
      properties:
        ok: { type: boolean }
      required: [ok]
    Heading:
      type: object
      properties:
        title: { type: string }
        page: { type: integer }
        level: { type: integer }
        breadcrumb:
          type: array
          items: { type: string }
      required: [title, page, level]
    IndexTopResponse:
      type: object
      properties:
        book_id: { type: integer }
        max_level: { type: integer }
        results:
          type: array
          items: { $ref: "#/components/schemas/Heading" }
      required: [book_id, max_level, results]
    IndexSearchResult:
      allOf:
        - $ref: "#/components/schemas/Heading"
        - type: object
          properties:
            score: { type: number }
          required: [score]
    IndexSearchResponse:
      type: object
      properties:
        book_id: { type: integer }
        query: { type: string }
        results:
          type: array
          items: { $ref: "#/components/schemas/IndexSearchResult" }
      required: [book_id, query, results]
    IndexChunkResponse:
      type: object
      properties:
        book_id: { type: integer }
        offset: { type: integer }
        limit: { type: integer }
        has_more: { type: boolean }
        next_offset:
          type: [integer, "null"]
        results:
          type: array
          items: { $ref: "#/components/schemas/Heading" }
      required: [book_id, offset, limit, has_more, results]
    IndexWindowResponse:
      type: object
      properties:
        book_id: { type: integer }
        page: { type: integer }
        current:
          anyOf:
            - { $ref: "#/components/schemas/Heading" }
            - { type: "null" }
        before:
          type: array
          items: { $ref: "#/components/schemas/Heading" }
        after:
          type: array
          items: { $ref: "#/components/schemas/Heading" }
      required: [book_id, page, before, after]
